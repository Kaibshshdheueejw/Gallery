name: Flutter CI

# Builds and verifies the Flutter app in app/ (§9 CI/CD). This is also the
# compile/test feedback loop used during development in restricted
# environments: analyzer/test/build failures are re-emitted as check-run
# ANNOTATIONS so they are readable through the GitHub API even when raw log
# downloads are unavailable. Every push must be green before the next stage.
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"

jobs:
  analyze-test-build-android:
    name: Analyze · Test · Build APK (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          java -version

      - name: Dependencies
        run: flutter pub get

      - name: Generate localizations (gen-l10n)
        run: flutter gen-l10n

      # Debug aid: report the resolved photo_manager version and its actual
      # API signatures as annotations (raw log downloads are unavailable in
      # the development sandbox). Remove once the seam is finalized.
      - name: Report plugin API
        run: |
          VER=$(awk '/^  photo_manager:/{f=1} f && /version:/{print $2; exit}' pubspec.lock | tr -d '"')
          echo "::notice title=pm-version::$VER"
          SRC="$HOME/.pub-cache/hosted/pub.dev/photo_manager-$VER"
          if [ -d "$SRC" ]; then
            grep -rn "getPermissionState\|requestPermissionExtend" "$SRC/lib" --include=*.dart | head -10 | while IFS= read -r l; do echo "::notice title=pm-api::$l"; done
            grep -rn "class .*Option" "$SRC/lib" --include=*.dart | head -10 | while IFS= read -r l; do echo "::notice title=pm-api::$l"; done
            ENT=$(find "$SRC/lib" -name "entity*.dart" | head -1)
            grep -n "get size\|titleAsync\|relativePath" "$ENT" | head -12 | while IFS= read -r l; do echo "::notice title=pm-api::$l"; done
          fi

      - name: Analyze
        run: |
          set +e
          dart analyze --format=machine lib test > analyze.txt 2>&1
          code=$?
          # Machine format: SEVERITY|TYPE|CODE|FILE|LINE|COL|LENGTH|MESSAGE
          while IFS='|' read -r sev type ecode file line col len msg; do
            case "$sev" in
              ERROR)   echo "::error file=app/$file,line=$line,col=$col,title=analyzer::$msg" ;;
              WARNING) echo "::warning file=app/$file,line=$line,col=$col,title=analyzer::$msg" ;;
            esac
          done < analyze.txt
          echo "Analyzer issues: $(grep -c '^ERROR' analyze.txt || true) errors"
          exit $code

      - name: Unit + widget tests
        run: |
          set +e
          # Expanded reporter + serial files so a stall names its test; the
          # shell `timeout` caps the whole step regardless of framework bugs.
          timeout 600 flutter test --reporter=expanded --concurrency=1 > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # Single-line annotation: % escaped first, then newlines → %0A.
            MSG=$(tail -n 300 test.log | tr -d '\r' | sed 's/%/%25/g' | tr '\n' '\036' | sed 's/\x1E/%0A/g')
            echo "::error title=flutter-test-failures::$MSG"
          fi
          tail -n 40 test.log
          exit $code

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error|Error|FAILURE|Exception|e: " build.log | head -n 60 | while read -r l; do
              echo "::error title=apk-build::$l"
            done
          fi
          tail -n 30 build.log
          exit $code

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS (release, no codesign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Dependencies
        run: flutter pub get

      - name: Generate localizations (gen-l10n)
        run: flutter gen-l10n

      - name: Build iOS release (no codesign)
        run: |
          set +e
          flutter build ios --release --no-codesign > build-ios.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error|Error|FAILURE|Exception|failed" build-ios.log | head -n 60 | while read -r l; do
              echo "::error title=ios-build::$l"
            done
          fi
          tail -n 40 build-ios.log
          exit $code

      - name: Upload iOS app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-ios-app
          path: app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
