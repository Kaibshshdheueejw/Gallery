name: Flutter CI

# Builds and verifies the Flutter app in app/ (§9 CI/CD). This is also the
# compile/test feedback loop used during development in restricted
# environments: analyzer/test/build failures are re-emitted as check-run
# ANNOTATIONS so they are readable through the GitHub API even when raw log
# downloads are unavailable. Every push must be green before the next stage.
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"

jobs:
  analyze-test-build-android:
    name: Analyze · Test · Build APK (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          java -version

      - name: Dependencies
        run: flutter pub get

      - name: Generate localizations (gen-l10n)
        run: flutter gen-l10n

      - name: Analyze
        run: |
          set +e
          dart analyze --format=machine lib test > analyze.txt 2>&1
          code=$?
          # Machine format: SEVERITY|TYPE|CODE|FILE|LINE|COL|LENGTH|MESSAGE
          while IFS='|' read -r sev type ecode file line col len msg; do
            case "$sev" in
              ERROR)   echo "::error file=app/$file,line=$line,col=$col,title=analyzer::$msg" ;;
              WARNING) echo "::warning file=app/$file,line=$line,col=$col,title=analyzer::$msg" ;;
            esac
          done < analyze.txt
          echo "Analyzer issues: $(grep -c '^ERROR' analyze.txt || true) errors"
          exit $code

      - name: Unit + widget tests
        run: |
          set +e
          flutter test > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -c 6000 test.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' > /dev/null || true
            # Emit the failing section as a single annotation (message limit ~64KB).
            {
              echo "::error title=flutter-test-failures::"
              tail -n 120 test.log | tr '\n' '\036' | sed 's/\x1E/%0A/g'
              echo ""
            }
          fi
          tail -n 40 test.log
          exit $code

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error|Error|FAILURE|Exception|e: " build.log | head -n 60 | while read -r l; do
              echo "::error title=apk-build::$l"
            done
          fi
          tail -n 30 build.log
          exit $code

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # iOS archive job (Stage 1): requires a macOS runner. Enable once the
  # ios/ platform folder lands — kept here so the pipeline shape is final.
  # build-ios:
  #   runs-on: macos-latest
  #   defaults: { run: { working-directory: app } }
